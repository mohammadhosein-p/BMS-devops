name: CI Quality Gates

on:
  workflow_dispatch:

  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/ci-workflow

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: Add chart repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      - name: Build chart dependencies
        run: |
          helm dependency build ./helm/argocd
          helm dependency build ./helm/bms
          helm dependency build ./helm/monitoring

      - name: Lint charts
        run: |
          helm lint ./helm/argocd
          helm lint ./helm/bms
          helm lint ./helm/monitoring
  kubeconform:
    name: Manifest Schema Validation (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: Add chart repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      - name: Build chart dependencies
        run: |
          helm dependency build ./helm/argocd
          helm dependency build ./helm/bms
          helm dependency build ./helm/monitoring

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate argocd chart
        run: |
          helm template argocd ./helm/argocd > /tmp/argocd-rendered.yaml
          kubeconform -summary -strict -ignore-missing-schemas /tmp/argocd-rendered.yaml

      - name: Validate bms chart
        run: |
          helm template bms ./helm/bms > /tmp/bms-rendered.yaml
          kubeconform -summary -strict -ignore-missing-schemas /tmp/bms-rendered.yaml

      - name: Validate monitoring chart
        run: |
          helm template monitoring ./helm/monitoring > /tmp/monitoring-rendered.yaml
          kubeconform -summary -strict -ignore-missing-schemas /tmp/monitoring-rendered.yaml
      
      - name: Validate raw manifests
        run: |
          kubeconform -summary -strict -ignore-missing-schemas ./manifests-raw

  trivy-config:
    name: IaC Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: Add chart repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      - name: Build chart dependencies
        run: |
          helm dependency build ./helm/argocd
          helm dependency build ./helm/bms
          helm dependency build ./helm/monitoring

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          exit-code: "1"
          severity: "CRITICAL"
          skip-dirs: "helm/*/charts"
          hide-progress: true

  chart-testing:
    name: Chart Install Test (chart-testing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: Setup Python 
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Chart Testing
        uses: helm/chart-testing-action@v2

      - name: Add chart repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Run chart-testing (Only Install)  
        run: ct install --config .github/ct.yaml