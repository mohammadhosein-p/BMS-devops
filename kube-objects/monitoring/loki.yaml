apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring

data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      replication_factor: 1

      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      filesystem:
        directory: /loki/chunks

    limits_config:
      allow_structured_metadata: true
      volume_enabled: true

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: loki-pv

spec:
  capacity:
    storage: 1Gi

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  storageClassName: manual-loki

  hostPath:
    path: /data/loki


---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-pvc
  namespace: monitoring

spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: manual-loki

  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: loki

  template:
    metadata:
      labels:
        app: loki

    spec:
      securityContext:
        fsGroup: 10001

      initContainers:
        - name: fix-permissions
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              chown -R 10001:10001 /loki
              chmod -R 755 /loki

          securityContext:
            runAsUser: 0

          volumeMounts:
            - name: storage
              mountPath: /loki

      containers:
        - name: loki
          image: grafana/loki:3.5.5

          args:
            - "-config.file=/etc/loki/loki.yaml"

          ports:
            - containerPort: 3100

          volumeMounts:
            - name: config
              mountPath: /etc/loki

            - name: storage
              mountPath: /loki

      volumes:
        - name: config
          configMap:
            name: loki-config

        - name: storage
          persistentVolumeClaim:
            claimName: loki-pvc


---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring

spec:
  type: ClusterIP

  selector:
    app: loki

  ports:
    - port: 3100
      targetPort: 3100
      protocol: TCP