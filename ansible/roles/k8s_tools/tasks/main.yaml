---
- name: Download kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ k8s_tools_kubectl_version }}/bin/linux/{{ k8s_tools_system_arch }}/kubectl"
    dest: "{{ k8s_tools_bin_dir }}/kubectl"
    mode: '0755'
  become: true

- name: Download and unpack Helm
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ k8s_tools_helm_version }}-linux-{{ k8s_tools_system_arch }}.tar.gz"
    dest: "/tmp"
    remote_src: true

- name: Move Helm binary
  ansible.builtin.copy:
    src: "/tmp/linux-{{ k8s_tools_system_arch }}/helm"
    dest: "{{ k8s_tools_bin_dir }}/helm"
    mode: '0755'
    remote_src: true
  become: true

- name: Download Kind
  ansible.builtin.get_url:
    url: "https://kind.sigs.k8s.io/dl/{{ k8s_tools_kind_version }}/kind-linux-{{ k8s_tools_system_arch }}"
    dest: "{{ k8s_tools_bin_dir }}/kind"
    mode: '0755'
  become: true
