---
- name: Check if Kind cluster already exists
  command: kind get clusters
  register: existing_clusters
  changed_when: false

- name: Render Kind cluster config
  template:
    src: kind-config.yaml.j2
    dest: "{{ kind_config_path }}"
    mode: '0644'
  when: cluster_name not in existing_clusters.stdout_lines

- name: Create Kind cluster
  command: "kind create cluster --name {{ cluster_name }} --config {{ kind_config_path }}"
  when: cluster_name not in existing_clusters.stdout_lines