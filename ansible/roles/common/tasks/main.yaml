---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install basic utilities
  ansible.builtin.apt:
    name:
      - curl
      - git
      - jq
      - unzip
      - python3-pip
      - software-properties-common
    state: present
  become: true
