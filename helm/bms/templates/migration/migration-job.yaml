{{- if .Values.migration.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-postgres-migration
  annotations:
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres-migration
    spec:
      restartPolicy: OnFailure
      
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: 
            - 'sh'
            - '-c'
            - 'until nc -z {{ .Release.Name }}-postgresql {{ .Values.postgresql.primary.service.ports.postgresql | default 5432 }}; do echo waiting for postgres; sleep 2; done;'

      containers:
        - name: migration
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          env:
            - name: GOOSE_DRIVER
              value: {{ .Values.migration.driver | quote }}

            - name: GOOSE_DBSTRING
              value: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ .Release.Name }}-postgresql:{{ .Values.postgresql.primary.service.ports.postgresql | default 5432 }}/{{ .Values.postgresql.auth.database }}?sslmode={{ .Values.migration.sslmode }}"

            - name: GOOSE_COMMAND
              value: {{ .Values.migration.command | quote }}
{{- end -}}