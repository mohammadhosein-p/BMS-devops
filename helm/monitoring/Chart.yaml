apiVersion: v2
name: monitoring
description: Simple Observability Stack (Prometheus, Node Exporter, Kube-State-Metrics) without CRDs
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: prometheus
    version: "25.x.x"
    repository: "https://prometheus-community.github.io/helm-charts"
  - name: grafana
    version: "8.5.1"
    repository: "https://grafana.github.io/helm-charts"
  - name: loki
    version: "6.6.0"
    repository: "https://grafana.github.io/helm-charts"
  - name: alloy
    version: "0.2.0"
    repository: "https://grafana.github.io/helm-charts"